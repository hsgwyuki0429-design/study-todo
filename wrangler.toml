# Cloudflare Workers へ study-todo MCP Server を置くための設定。
#
#   1. npx wrangler secret put STUDY_TODO_OWNER_KEY
#      （管理キー。ここで入力した値はリポジトリには残らない）
#   2. npx wrangler deploy
#
# main へ push すれば GitHub Actions が同じことをする
# （.github/workflows/deploy.yml）。手で配るのは最初の1回だけでよい。
#
# 秘密（STUDY_TODO_OWNER_KEY）は必ず secret として入れること。
# Routine 接続も Worker Secrets のみ: CLAUDE_ROUTINE_FIRE_URL / CLAUDE_ROUTINE_API_TOKEN
# Jev（TypeSafe AI）も同じく secret: JEV_API_KEY（JEV_API_URL / JEV_MODEL は任意）
# このファイルへ直接書くとGitHubへ公開されてしまう。
#
# どのプランナーを動かすかは PLANNER_PROVIDER で決める（既定は claude_routine）。
#   claude_routine … これまでどおり Claude Routine を起動する
#   jev_shadow     … Jev の案を作るが、保存はしない（品質を測る段階）
#   jev            … Jev の案を、制約を確かめたうえで保存する
#   off            … 自動再計画をしない

name = "study-todo-mcp"
main = "server/adapters/cloudflare.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Cron uses UTC; 18:00 UTC is 03:00 JST on the following date.
[triggers]
crons = ["0 18 * * *"]

# Checked against Wrangler's config-schema.json (Observability).
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
# Native fetch spans include url.full / url.path, including the secret Fire URL.
enabled = false

[vars]
# 段階的に進める。shadow で判断の質を見てから jev へ切り替える。
PLANNER_PROVIDER = "claude_routine"
STUDY_TODO_SITE_ORIGIN = "https://hsgwyuki0429-design.github.io/study-todo"
STUDY_TODO_ALLOWED_ORIGINS = "https://hsgwyuki0429-design.github.io"

[[kv_namespaces]]
binding = "STUDY_TODO_KV"
id = "6323230941a246aabb65915bddc0be94"

# 予定をタスク単位で安全に書き換えるための保存先。
#
# KV は「最後に書いた人が勝つ」保存先で、「読んだときから変わっていなければ書く」
# ということができない。そのため、複数の日の予定をまとめて確かめてから書く処理を
# KV だけで正しく行えない。Durable Object は1つだけ存在するオブジェクトで、
# その中の保存先はトランザクションに対応しているため、ここへ読み書きを集める。
#
# すでに KV でデータを預けている場合は、初回アクセスのときに一度だけ
# 自動で写される（server/storage/do-driver.js の migrateFromKv）。
# 写し終えても KV のデータは消さないので、元に戻すこともできる。
[[durable_objects.bindings]]
name = "STUDY_TODO_STORE"
class_name = "StudyTodoStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StudyTodoStore"]
