<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>青チャート学習管理</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-records" hidden></section>
  <section class="screen" id="screen-schedule" hidden></section>
  <section class="screen" id="screen-settings" hidden></section>
  <nav class="tabbar" role="tablist"></nav>
</div>

<dialog id="dialog-import">
  <form method="dialog">
    <div class="view-title" style="margin-bottom:8px">問題マスタのインポート</div>
    <div class="dialog-note">
      Question[] の JSON 配列を貼り付けてください（id / subject / chapter / section / type / number / label）。
    </div>
    <textarea id="import-text" placeholder='[{"subject":"数学I+A","chapter":"数列","section":"漸化式","type":"例題","number":90}]'></textarea>
    <div class="timer-actions">
      <button class="btn" value="cancel">キャンセル</button>
      <button class="btn btn-primary" id="import-run" value="ok" type="button">取り込む</button>
    </div>
  </form>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
